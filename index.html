<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101112">
  <meta name="description" content="Interaktywny kurs VALORANT: role, agenci, quizy i dodatkowe lekcje wideo.">
  <title>Spike School — VALORANT od podstaw</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="media-config.js"></script>
  <script src="skill-media-config.js"></script>
  <script src="game-data.js"></script>
  <script src="glossary-data.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="Spike School — strona główna"><span class="brand-mark">S<span></span></span><span>SPIKE<span class="brand-light">SCHOOL</span></span></a>
      <div class="side-label">TWOJA ŚCIEŻKA</div>
      <nav class="nav" aria-label="Nawigacja kursu">
        <button class="nav-item active" data-nav="overview"><span class="nav-icon">⌂</span> Start</button>
        <button class="nav-item" data-nav="roles"><span class="nav-icon">◈</span> Lekcja 1 · Role <span class="nav-index">01</span></button>
        <button class="nav-item" data-nav="agents"><span class="nav-icon">◎</span> Lekcja 2 · Agenci <span class="nav-index">02</span></button>
        <button class="nav-item" data-nav="maps"><span class="nav-icon">⌖</span> Lekcja 3 · Mapy <span class="nav-index">03</span></button>
        <button class="nav-item" data-nav="practice"><span class="nav-icon">✳</span> Trening</button>
        <button class="nav-item" data-nav="extras"><span class="nav-icon">▰</span> Dodatkowe lekcje</button>
        <button class="nav-item" data-nav="glossary"><span class="nav-icon">≡</span> Słownik</button>
      </nav>
      <div class="sidebar-bottom"><div class="mini-card"><span class="mini-kicker">MAŁY TIP</span><p>Najpierw poznaj rolę. Potem zobacz, jak konkretny agent pomaga drużynie.</p><span class="mini-line"></span></div><div class="side-foot"><span class="online-dot"></span> TRYB NAUKI <span class="version">v2.0</span></div></div>
    </aside>

    <main class="main" id="home">
      <header class="topbar"><div class="breadcrumb">SPIKE SCHOOL <span>/</span> <b id="crumb">START</b></div><div class="top-right"><span class="status"><i></i> KURS VALORANT</span><div class="avatar">✦</div></div></header>
      <div id="screen-root" aria-live="polite"></div>
      <footer class="footer"><span>SPIKE SCHOOL <i>///</i> NIEOFICJALNY KURS FANOWSKI</span><a href="https://playvalorant.com/pl-pl/agents/" target="_blank" rel="noreferrer">AGENTI VALORANT ↗</a></footer>
    </main>
  </div>

  <dialog class="lesson-dialog quiz-dialog" id="quiz-dialog" aria-labelledby="dialog-title">
    <div class="dialog-top"><span class="dialog-kicker" id="dialog-kicker">SPRAWDŹ SIĘ</span><button class="close-button" id="close-dialog" aria-label="Zamknij">×</button></div>
    <div class="dialog-scroll"><h2 id="dialog-title"></h2><div id="quiz-prompt"></div><div class="quiz" id="quiz"><div class="quiz-heading"><span id="quiz-label">✳ PYTANIE</span><span id="quiz-counter"></span></div><h3 id="quiz-question"></h3><div id="quiz-media"></div><div id="quiz-options" class="quiz-options"></div><div class="quiz-feedback" id="quiz-feedback" aria-live="polite"></div><button class="primary-button quiz-next" id="quiz-next" disabled>SPRAWDŹ ODPOWIEDŹ <span>↗</span></button></div></div>
  </dialog>
</body>
</html>
